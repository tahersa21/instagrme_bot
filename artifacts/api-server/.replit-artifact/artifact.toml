kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "bash -c 'cd /home/runner/workspace/instagram-auto-liker/backend && uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload'"

[services.production]

[services.production.run]
args = ["bash", "-c", "cd /home/runner/workspace/instagram-auto-liker/backend && /home/runner/workspace/.pythonlibs/bin/python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 1"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/health"

[services.env]
PORT = "8080"
