version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ial-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: ial-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
